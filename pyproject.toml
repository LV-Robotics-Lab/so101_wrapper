[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "so101-wrapper"
version = "0.1.0"
description = "Fail-closed SO-101 and XLeRobot composition for AmazingHand end effectors"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "LV Robotics Lab" }]
dependencies = []
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.14,<0.15",
]

[project.scripts]
so101-wrapper = "so101_wrapper.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
  "src/so101_wrapper",
  "src/lerobot_robot_xlerobot_amazing",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
