name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: Python ${{ matrix.python-version }} offline
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Assert dependency repos are not nested
        run: |
          python - <<'PY'
          import subprocess

          entries = subprocess.run(
              ["git", "ls-files", "--stage"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          gitlinks = [line for line in entries if line.startswith("160000 ")]
          if gitlinks:
              raise SystemExit(f"nested submodules are forbidden: {gitlinks}")
          PY
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' build
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m so101_wrapper doctor --backend fake --profile arms_only
      - run: python -m so101_wrapper doctor --backend fake --profile arms_base
      - run: python -m build
