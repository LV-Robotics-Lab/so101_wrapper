name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: Python ${{ matrix.python-version }} offline
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Assert dependency repos are not nested
        run: |
          python - <<'PY'
          import subprocess

          entries = subprocess.run(
              ["git", "ls-files", "--stage"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          gitlinks = [line for line in entries if line.startswith("160000 ")]
          if gitlinks:
              raise SystemExit(f"nested submodules are forbidden: {gitlinks}")
          PY
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' build
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --ignore=tests/test_amazinghand_dependency.py
      - run: python -m so101_wrapper doctor --backend fake --profile arms_only
      - run: python -m so101_wrapper doctor --backend fake --profile arms_base
      - run: python -m build

  amazinghand-contract:
    name: Pinned AmazingHand public API
    runs-on: ubuntu-latest
    env:
      AMAZINGHAND_COMMIT: 3f756af8787e6ee8b2c098a40bd4c60899b9e81c
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Install exact AmazingHand compatibility pin
        run: >-
          python -m pip install
          "amazinghand-wrapper @ git+https://github.com/LV-Robotics-Lab/amazinghand_wrapper.git@${AMAZINGHAND_COMMIT}"
      - name: Verify manifest pin and public-only adapter contract
        run: |
          python - <<'PY'
          import os
          from so101_wrapper import VALIDATED_AMAZINGHAND_COMMIT

          assert VALIDATED_AMAZINGHAND_COMMIT == os.environ["AMAZINGHAND_COMMIT"]
          PY
          pytest -q tests/test_amazinghand_dependency.py
